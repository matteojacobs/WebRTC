<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC</title>
</head>
<body>
    <!-- qr-code div -->
    <div id="qr-code"></div>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="badge">particle life · step 4</div>

    <!-- Add socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Qr-code generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- QR-code logic -->
     <script>
        {
            let peer;
            let socket;
            let phoneData = null;

            const servers = {
                iceServers: [{
                    urls: 'stun:stun.l.google.com:19302'
                }]
            };

            const init = () => {
                initSocket();
                initParticleLife();
            }

            const initSocket = async () => {
                socket = io.connect("/");
                socket.on("connect", () => {
                    const url = `${new URL(`/controller.html?id=${socket.id}`,window.location)}`;   
                    const typeNumber = 4;
                    const errorCorrectionLevel = 'L';
                    const qr = qrcode(typeNumber, errorCorrectionLevel);
                    qr.addData(url);
                    qr.make();
                    document.getElementById('qr-code').innerHTML = qr.createImgTag(10);
                });

                socket.on('signal', (myId, signal, peerId) => {
                    if (!peer || peer.destroyed) {
                        peer = new SimplePeer({
                            initiator: false,
                            config: servers
                        });

                        peer.on('signal', data => {
                            socket.emit('signal', peerId, data);
                        });

                        peer.on('data', (data) => {
                            phoneData = JSON.parse(data);
                            console.log(phoneData)
                        });

                    }

                    peer.signal(signal);
                });
            };

            const initParticleLife = () => {
                // ─────────────────────────────────────────
                //  CANVAS SETUP
                // ─────────────────────────────────────────
                const canvas = document.getElementById('canvas');
                const ctx    = canvas.getContext('2d');

                let width = 0, height = 0;

                const resize = () => {
                    width  = canvas.width  = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };

                window.addEventListener('resize', resize);
                resize();


                // ─────────────────────────────────────────
                //  PARTICLE GROUPS & COLORS
                // ─────────────────────────────────────────
                const colors = {
                    red:    '#ff4444',
                    green:  '#44ff88',
                    blue:   '#4488ff',
                    yellow: '#ffdd44',
                    orange: '#ff8833',
                    purple: '#cc44ff',
                    cyan:   '#44ffee',
                    pink:   '#ff44aa',
                    lime:   '#aaff33',
                    white:  '#ffffff',
                };

                const colorKeys = Object.keys(colors);
                const particleCount = 200;
                let groups = {};

                const createParticle = () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    velocityX: 0,
                    velocityY: 0,
                });

                const spawnGroups = () => {
                groups = {};
                for (const color in colors) {
                    groups[color] = Array.from({ length: particleCount }, createParticle);
                }
            };

                spawnGroups();


                // ─────────────────────────────────────────
                //  PHYSICS PARAMETERS
                // ─────────────────────────────────────────
                const interactionRadius   = 100;
                const friction            = 0.65;
                const maxSpeed            = 4;
                const minRepulseDistance  = 10;


                // ─────────────────────────────────────────
                //  FORCE MATRIX
                // ─────────────────────────────────────────                
                let matrix = {};

                const randomForce = () => (Math.random() * 2 - 1) - 0.3;

                const randomizeMatrix = () => {
                    matrix = {};
                    for (const a of colorKeys) {
                        matrix[a] = {};
                        for (const b of colorKeys) {
                            matrix[a][b] = randomForce();
                        }
                    }
                };

                randomizeMatrix();

                // ─────────────────────────────────────────
                //  PHONE DATA RULESET
                //  This function modifies the force matrix based on phone sensors
                // ─────────────────────────────────────────
                const applyPhoneDataRules = () => {
                    if (!phoneData || !phoneData.permissions || !phoneData.sensors) return;

                    const permissions = phoneData.permissions;
                    const sensors = phoneData.sensors;

                    if (permissions.Gyro === 'granted') {

                    }

                    if (permissions.Microphone === 'granted') {
                
                    }

                    if (permissions.Battery === 'granted') {
                      
                    }

                    if (permissions.Orientation === 'granted') {
                       
                    }
                };

                // ─────────────────────────────────────────
                //  CORE FORCE FUNCTION
                // ─────────────────────────────────────────
                const rule = (groupA, groupB, g, repulsionZone = 25) => {
                    for (let i = 0; i < groupA.length; i++) {
                    let forceX = 0;
                    let forceY = 0;

                    // Apply compass direction if available
                    if (window.compassDirection) {
                        forceX += window.compassDirection.x * 0.1;
                        forceY += window.compassDirection.y * 0.1;
                    }

                    for (let j = 0; j < groupB.length; j++) {
                        const distanceX = groupB[j].x - groupA[i].x;
                        const distanceY = groupB[j].y - groupA[i].y;
                        const distance  = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                        if (distance === 0 || distance >= interactionRadius) continue;

                        if (distance < repulsionZone) {
                        const pushStrength = (repulsionZone - distance) / repulsionZone;
                        forceX -= (distanceX / distance) * pushStrength * 2;
                        forceY -= (distanceY / distance) * pushStrength * 2;
                        continue;
                        }

                        if (distance < minRepulseDistance) {
                        forceX -= (distanceX / distance);
                        forceY -= (distanceY / distance);
                        continue;
                        }

                        const force = g / distance;
                        forceX += force * distanceX;
                        forceY += force * distanceY;
                    }

                    groupA[i].velocityX = (groupA[i].velocityX + forceX) * friction;
                    groupA[i].velocityY = (groupA[i].velocityY + forceY) * friction;

                    const speed = Math.sqrt(
                        groupA[i].velocityX * groupA[i].velocityX +
                        groupA[i].velocityY * groupA[i].velocityY
                    );
                    if (speed > maxSpeed) {
                        groupA[i].velocityX *= maxSpeed / speed;
                        groupA[i].velocityY *= maxSpeed / speed;
                    }

                    groupA[i].x += groupA[i].velocityX;
                    groupA[i].y += groupA[i].velocityY;

                    if (groupA[i].x < 0)      { groupA[i].x = 0;      groupA[i].velocityX *= -3; }
                    if (groupA[i].x > width)  { groupA[i].x = width;  groupA[i].velocityX *= -3; }
                    if (groupA[i].y < 0)      { groupA[i].y = 0;      groupA[i].velocityY *= -3; }
                    if (groupA[i].y > height) { groupA[i].y = height; groupA[i].velocityY *= -3; }
                    }
                };


                // ─────────────────────────────────────────
                //  SIMULATION STATE
                // ─────────────────────────────────────────
                let paused     = false;
                let frameCount = 0;

                const totalParticles = () => {
                    let n = 0;
                    for (const c in groups) n += groups[c].length;
                    return n;
                };


                // ─────────────────────────────────────────
                //  UPDATE
                // ─────────────────────────────────────────
                const update = () => {
                    if (paused) return;
                    
                    // Apply phone data rules to modify the force matrix
                    applyPhoneDataRules();
                    
                    for (const a of colorKeys) {
                    for (const b of colorKeys) {
                        rule(groups[a], groups[b], matrix[a][b]);
                    }
                    }
                    
                    // Reset dynamic values each frame
                    window.dynamicInteractionRadius = null;
                    window.dynamicFriction = null;
                    window.dynamicMaxSpeed = null;
                    window.compassDirection = null;
                };


                // ─────────────────────────────────────────
                //  DRAW
                // ─────────────────────────────────────────
                const particleRadius = 7;

                const drawParticles = () => {
                    for (const color in groups) {
                    ctx.fillStyle = colors[color];
                    for (const p of groups[color]) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, particleRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    }
                };

                const draw = () => {
                    ctx.fillStyle = '#080a0f';
                    ctx.fillRect(0, 0, width, height);
                    drawParticles();
                };


                // ─────────────────────────────────────────
                //  MAIN LOOP
                // ─────────────────────────────────────────
                const loop = () => {
                    update();
                    draw();
                    requestAnimationFrame(loop);
                };

                requestAnimationFrame(loop);


                // ─────────────────────────────────────────
                //  KEYBOARD CONTROLS
                // ─────────────────────────────────────────
                document.addEventListener('keydown', e => {
                    switch (e.key.toLowerCase()) {
                    case 'p': paused = !paused;           break;
                    case 'r': spawnGroups(); randomizeMatrix(); frameCount = 0; break;
                    case 'm': randomizeMatrix();          break;
                    }
                });
                };

                
            init();
        }
     </script>

  
</body>
</html>
