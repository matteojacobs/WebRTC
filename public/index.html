<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC</title>
    <link rel="stylesheet" href="./styling/index_styling.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="qr-overlay">
        <div id="qr-card">
            <!-- scan state -->
            <div id="state-scan">
                <span class="eyebrow">Magic Wand Setup</span>
                <h1>Scan the QR code to connect your <em>magic wand</em> (phone)!</h1>
                <div id="qr-code"></div>
                <p class="hint">Point your camera at the code above</p>
            </div>
            <!-- connected state -->
            <div id="state-connected">
                <span class="eyebrow">Wand Connected</span>
                <h1>Grant your wand's permissions to <em>bend the microbial world</em> to your will</h1>
                <div class="connected-icon">✦</div>
                <p class="hint">Allow motion, microphone &amp; orientation on your phone</p>
            </div>
        </div>
    </div>

    <div id="hud"></div>
    <div id="badge">particle life · step 4</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="./logic/index_logic.js"></script>
</body>
</html>
