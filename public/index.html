<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC</title>
</head>
<body>
    <!-- qr-code div -->
    <div id="qr-code"></div>

    <!-- Add socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Qr-code generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- QR-code logic -->
     <script>
        {
            let socket;
            let peerConnection

            const servers = {
                iceServers: [{
                    urls: 'stun:192.168.1.45:443'
                }]
            };

            const init = () => {
                initSocket();
            }

            const initSocket = async () => {
                socket = io.connect("/")
                socket.on("connect", () => {
                    // console.log(`connect: ${socket.id}`);
                    //combines current url plus unique socket id, this is how the phone knows which desktop to send controls to.
                    const url = `${new URL(`/controller.html?id=${socket.id}`,window.location)}`;
                    
                    //the bigger typeNumber, the more data it can hold, the bigger the qr-code
                    const typeNumber = 4;
                    //the errorCorrectionLevel makes sure that even if the qr-code is partially damaged or obscured it can still be scanned
                    const errorCorrectionLevel = 'L';
                    const qr = qrcode(typeNumber, errorCorrectionLevel);
                    qr.addData(url);
                    qr.make();
                    document.getElementById('qr-code').innerHTML = qr.createImgTag(10);
                })

                socket.on('clients', updatePeerList);
            
                socket.on('peerIce', async (myId, candidate, peerId) => {
                    console.log(`Received peerIce from ${peerId}`, candidate);
                    await handlePeerIce(myId, candidate, peerId);
                });

                socket.on('peerAnswer', async (myId, answer, peerId) => {
                    console.log(`Received peerAnswer from ${peerId}`);
                    console.log(answer);
                    await handlePeerAnswer(myId, answer, peerId);
                });
            }

            const updatePeerList = (clients) => {
                for (const clientId in clients) {
                    const isMyOwnId = (clientId === socket.id);
                    if (clients.hasOwnProperty(clientId) && !isMyOwnId) {
                        const client = clients[clientId];
                        console.log(client.id);
                        callPeer(client.id);
                    }
                }
            };

            const callPeer = async (peerId) => {
                peerConnection = new RTCPeerConnection(servers)

                peerConnection.onicecandidate = (e) => {
                    console.log('ice candidate', e.candidate);
                    socket.emit('peerIce', peerId, e.candidate);
                };

                //don't understand why this is necessary
                peerConnection.createDataChannel('init'); 

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('peerOffer', peerId, offer);
            }

            const handlePeerAnswer = async (myId, answer, peerId) => {
                await peerConnection.setRemoteDescription(answer);
            };

            const handlePeerIce = async (myId, candidate, peerId) => {
                if (!candidate) {
                    return;
                }
                await peerConnection.addIceCandidate(candidate);
            };

            init();
        }
     </script>

  
</body>
</html>
