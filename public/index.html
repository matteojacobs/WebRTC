<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080a0f; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- qr-code div -->
    <div id="qr-code"></div>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="badge">particle life · step 4</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script>
        {
            let peer;
            let socket;
            let phoneData = null;

            const servers = {
                iceServers: [{
                    urls: 'stun:stun.l.google.com:19302'
                }]
            };

            const init = () => {
                initSocket();
                initParticleLife();
            }

            const initSocket = async () => {
                socket = io.connect("/");
                socket.on("connect", () => {
                    const url = `${new URL(`/controller.html?id=${socket.id}`, window.location)}`;
                    const typeNumber = 4;
                    const errorCorrectionLevel = 'L';
                    const qr = qrcode(typeNumber, errorCorrectionLevel);
                    qr.addData(url);
                    qr.make();
                    document.getElementById('qr-code').innerHTML = qr.createImgTag(10);
                });

                socket.on('signal', (myId, signal, peerId) => {
                    if (!peer || peer.destroyed) {
                        peer = new SimplePeer({
                            initiator: false,
                            config: servers
                        });

                        peer.on('signal', data => {
                            socket.emit('signal', peerId, data);
                        });

                        peer.on('data', (data) => {
                            phoneData = JSON.parse(data);
                            console.log(phoneData);
                            
                        });
                    }

                    peer.signal(signal);
                });
            };

            const initParticleLife = () => {
                // ─────────────────────────────────────────
                //  CANVAS SETUP
                // ─────────────────────────────────────────
                const canvas = document.getElementById('canvas');
                const ctx    = canvas.getContext('2d');

                let width  = 0;
                let height = 0;

                const resize = () => {
                    width  = canvas.width  = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };

                window.addEventListener('resize', resize);
                resize();


                // ─────────────────────────────────────────
                //  PARAMETERS
                // ─────────────────────────────────────────
                let colorsAmount   = 6;
                const particleAmount = 1000;
                const particleRadius = 3;

                const maxDistance   = Math.min(width, height) * 0.1;
                const repulsionZone = 0.3;

                const deltaT      = 0.05;
                const frictionHL  = 0.3;
                const forceScale  = 8;
                let maxSpeed    = 2;

                const frictionFactor = Math.pow(0.5, deltaT / frictionHL);


                // ─────────────────────────────────────────
                //  COLORS
                // ─────────────────────────────────────────
                const colors = {
                    red:     '#ff4444',
                    green:   '#44ff88',
                    blue:    '#4488ff',
                    yellow:  '#ffdd44',
                    orange:  '#ff8833',
                    purple:  '#cc44ff',
                    cyan:    '#00ddff',
                    pink:    '#ff44aa',
                    lime:    '#aaff00',
                    white:   '#ffffff',
                };

                const colorKeys = Object.keys(colors);


                // ─────────────────────────────────────────
                //  FORCE CURVE
                // ─────────────────────────────────────────
                const force = (r, a) => {
                    if (r < repulsionZone) {
                        return (r / repulsionZone) - 1;
                    } else if (r < 1) {
                        const mid = (repulsionZone + 1) / 2;
                        return a * (1 - Math.abs(r - mid) / (1 - mid));
                    }
                    return 0;
                };


                // ─────────────────────────────────────────
                //  ATTRACTION MATRIX
                // ─────────────────────────────────────────

                let baseMatrix = [];
                let attractionMatrix = [];

                const makeRandomMatrix = () => {
                    baseMatrix = [];
                    for (let i = 0; i < colorsAmount; i++) {
                        const cols = [];
                        for (let j = 0; j < colorsAmount; j++) {
                            let v = Math.random() * 2 - 1;
                            if (Math.abs(v) < 0.15) v = (v >= 0 ? 1 : -1) * 0.5;
                            cols.push(v);
                        }
                        baseMatrix.push(cols);
                    }
                    attractionMatrix = baseMatrix.map(row => [...row]);
                };

                makeRandomMatrix();


                // ─────────────────────────────────────────
                //  PARTICLES
                // ─────────────────────────────────────────
                let particles = [];

                const createParticle = (index) => ({
                    positionX:  Math.random() * width,
                    positionY:  Math.random() * height,
                    velocityX:  0,
                    velocityY:  0,
                    color:      colorKeys[index % colorsAmount],
                    colorIndex: index % colorsAmount,
                });

                const spawnParticles = () => {
                    particles = [];
                    for (let i = 0; i < particleAmount; i++) particles.push(createParticle(i));
                };

                spawnParticles();


                // ─────────────────────────────────────────
                //  PHONE DATA RULESET
                //  This function modifies the force matrix based on phone sensors
                // ─────────────────────────────────────────
                const applyPhoneDataRules = () => {
                    if (!phoneData || !phoneData.permissions || !phoneData.sensors) return;

                    const permissions = phoneData.permissions;
                    const sensors = phoneData.sensors;

                    if (permissions.Gyro === 'granted') {
                        maxSpeed = 0.5 + (sensors.gyroMagnitude / 50) * 4.5;
                    }

                    if (permissions.Microphone === 'granted') {
                        const shift = (sensors.bassEnergy / 100);
                        for (let i = 0; i < colorsAmount; i++) {
                            for (let j = 0; j < colorsAmount; j++) {
                                attractionMatrix[i][j] = Math.max(-1, baseMatrix[i][j] - shift);
                            }
                        }
                    } else {
                        attractionMatrix = baseMatrix.map(row => [...row]);
                    }

                    if (permissions.Battery === 'granted') {
                        const newColorsAmount = Math.ceil(sensors.battery / 10);
                        

                        if (newColorsAmount > colorsAmount) {
                            colorsAmount = newColorsAmount;
                            const newColorIndex = colorsAmount - 1;
                            makeRandomMatrix();
                            const count = Math.floor(particleAmount / colorsAmount);
                            for (let i = 0; i < count; i++) {
                                particles.push({
                                    positionX:  Math.random() * width,
                                    positionY:  Math.random() * height,
                                    velocityX:  0,
                                    velocityY:  0,
                                    colorIndex: newColorIndex,
                                    color:      colorKeys[newColorIndex],
                                });
                            }
                        }

                        else if (newColorsAmount < colorsAmount) {
                            colorsAmount = newColorsAmount;
                            makeRandomMatrix();
                            particles = particles.filter(p => p.colorIndex < colorsAmount);
                        }                        
                    }

                    if (permissions.Orientation === 'granted') {

                    }
                };

                // ─────────────────────────────────────────
                //  PHYSICS UPDATE
                // ─────────────────────────────────────────
                const updateParticles = () => {
                    // Apply phone data rules to modify the attraction matrix
                    applyPhoneDataRules();

                    for (let i = 0; i < particles.length; i++) {
                        let fx = 0, fy = 0;
                        const pi = particles[i];

                        for (let j = 0; j < particles.length; j++) {
                            if (i === j) continue;
                            const pj = particles[j];

                            let dx = pj.positionX - pi.positionX;
                            let dy = pj.positionY - pi.positionY;

                            // Wrap-around distance
                            if (dx >  width  * 0.5) dx -= width;
                            if (dx < -width  * 0.5) dx += width;
                            if (dy >  height * 0.5) dy -= height;
                            if (dy < -height * 0.5) dy += height;

                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist === 0 || dist > maxDistance) continue;

                            const r = dist / maxDistance;
                            const f = force(r, attractionMatrix[pi.colorIndex][pj.colorIndex]);

                            fx += (dx / dist) * f;
                            fy += (dy / dist) * f;
                        }

                        pi.velocityX = pi.velocityX * frictionFactor + fx * forceScale * deltaT;
                        pi.velocityY = pi.velocityY * frictionFactor + fy * forceScale * deltaT;

                        // Clamp to maxSpeed
                        const speed = Math.sqrt(pi.velocityX * pi.velocityX + pi.velocityY * pi.velocityY);
                        if (speed > maxSpeed) {
                            const scale = maxSpeed / speed;
                            pi.velocityX *= scale;
                            pi.velocityY *= scale;
                        }
                    }

                    // Move particles with wrap-around
                    for (const p of particles) {
                        p.positionX = ((p.positionX + p.velocityX) % width  + width)  % width;
                        p.positionY = ((p.positionY + p.velocityY) % height + height) % height;
                    }
                };


                // ─────────────────────────────────────────
                //  DRAW
                // ─────────────────────────────────────────
                const drawParticles = () => {
                    for (const p of particles) {
                        ctx.fillStyle = colors[p.color];
                        ctx.beginPath();
                        ctx.arc(p.positionX, p.positionY, particleRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                };

                const draw = () => {
                    ctx.fillStyle = '#080a0f';
                    ctx.fillRect(0, 0, width, height);
                    drawParticles();
                };


                // ─────────────────────────────────────────
                //  MAIN LOOP
                // ─────────────────────────────────────────
                let paused = false;

                const loop = () => {
                    if (!paused) {
                        updateParticles();
                        draw();
                    }
                    requestAnimationFrame(loop);
                };

                requestAnimationFrame(loop);


                // ─────────────────────────────────────────
                //  KEYBOARD CONTROLS
                // ─────────────────────────────────────────
                document.addEventListener('keydown', e => {
                    switch (e.key.toLowerCase()) {
                        case 'p': paused = !paused;                          break;
                        case 'r': spawnParticles(); makeRandomMatrix();      break;
                        case 'm': makeRandomMatrix();                        break;
                    }
                });
            };

            init();
        }
    </script>
</body>
</html>
