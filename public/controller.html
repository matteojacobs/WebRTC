<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone</title>
</head>
<body>
    <h1>You connected phone and computer</h1>
    <button id="btn">Request Permission</button>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    

    <script src="/socket.io/socket.io.js"></script>
    <script>
        {
            let socket;
            let peer;
            let peerConnection;
            // let micStream;
            // let getAudioContext;
            // let analyser;

            const servers = {
                iceServers: [{
                    urls: 'stun:192.168.1.45:443'
                }]
            };

            const init = () => {
                initSocket();

                document.getElementById('btn').addEventListener('click', async () => {
                    const allGranted = await permissionRequests();
                    if (allGranted) {
                        startDataCollection();
                    } else {
                        console.log("Permission not granted");
                    }
                });
            }

            

            const permissionRequests = async (sensor) => {
                const results = {
                    Orientation: false,
                    Gyro: false,
                    // Microphone: false,
                };

                results.Orientation = await requestOrientation();
                results.Gyro = await requestGyro();
                // results.Microphone = await requestMicrophone();

                const allGranted = Object.values(results).every(v => v === true);
                return allGranted
            };

            const requestOrientation = async () => {
                try {
                    // iOS 13+ requires explicit permission
                    if (typeof DeviceOrientationEvent !== "undefined" &&
                        typeof DeviceOrientationEvent.requestPermission === "function") {
                        
                        const permission = await DeviceOrientationEvent.requestPermission();
                        return permission === "granted";
                    }

                    // Android / desktop — permission not required, just check API exists
                    return typeof DeviceOrientationEvent !== "undefined";

                } catch (error) {
                    console.log("Orientation permission failed:", error);
                    return false;
                }
            };


            const requestGyro = async () => {
                try {
                    // iOS 13+ requires explicit permission
                    if (typeof DeviceMotionEvent !== "undefined" &&
                        typeof DeviceMotionEvent.requestPermission === "function") {
                        
                        const permission = await DeviceMotionEvent.requestPermission();
                        return permission === "granted";
                    }

                    // Android / desktop — permission not required, just check API exists
                    return typeof DeviceMotionEvent !== "undefined";

                } catch (error) {
                    console.log("Gyro permission failed:", error);
                    return false;
                }
            };

            const requestMicrophone = async () => {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                
                    audioContext = new AudioContext();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    
                    const source = audioContext.createMediaStreamSource(micStream);
                    source.connect(analyser);

                    return true;

                } catch (error) {
                    console.log("Microphone permission failed:", error);
                }
            }

            const startDataCollection = () => {
                orientationData();
                gyroData();
                // microphoneData();
                compassData();
            }

            const orientationData = () => {
                let tiltDisplay = document.querySelector('#tilt-display');
                if (!tiltDisplay) {
                    tiltDisplay = document.createElement('h2');
                    tiltDisplay.id = 'tilt-display';
                    document.body.appendChild(tiltDisplay);
                }

                window.addEventListener('deviceorientation', (event) => {
                    const vertical = event.beta !== null ? event.beta.toFixed(1) : 'N/A';    // front/back tilt (-180 to 180)
                    const horizontal = event.gamma !== null ? event.gamma.toFixed(1) : 'N/A'; // left/right tilt (-90 to 90)

                    tiltDisplay.textContent = `↕ Vertical: ${vertical}°  |  ↔ Horizontal: ${horizontal}°`;
                });
            }

            const gyroData = () => {
                let gyroMagnitudeDisplay = document.querySelector('#gyroMagnitude-display');
                if (!gyroMagnitudeDisplay) {
                    gyroMagnitudeDisplay = document.createElement('h2');
                    gyroMagnitudeDisplay.id = 'gyroMagnitude-display';
                    document.body.appendChild(gyroMagnitudeDisplay);
                }

                window.addEventListener('devicemotion', (event) => {
                    const rotationRate = event.rotationRate;
                    const gyroMagnitude = Math.sqrt(rotationRate.alpha**2 + rotationRate.beta**2 + rotationRate.gamma**2)
                    const mappedGyroMagnitude = Math.min(Math.round((gyroMagnitude / 200) * 100), 100);
                    gyroMagnitudeDisplay.textContent = `rotation rate: ${mappedGyroMagnitude}`;
                });
            }

            const microphoneData = () => {
                let microphoneDisplay = document.querySelector('#microphone-display');
                if (!microphoneDisplay) {
                    microphoneDisplay = document.createElement('h2');
                    microphoneDisplay.id = 'microphone-display';
                    document.body.appendChild(microphoneDisplay);
                }

                analyser.fftSize = 256;

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                const bassRange = Math.floor(dataArray.length * 0.1);
                const bassSlice = dataArray.slice(0, bassRange);
                const bassEnergy = bassSlice.reduce((sum, v) => sum + v, 0) / bassRange;
                microphoneDisplay.textContent = `bass energy: ${bassEnergy}`;
            }
            
            const compassData = () => {
                let compassDisplay = document.querySelector('#compass-display');
                if (!compassDisplay) {
                    compassDisplay = document.createElement('h2');
                    compassDisplay.id = 'compass-display';
                    document.body.appendChild(compassDisplay);
                }

                
                

                window.addEventListener('deviceorientation', (event) => {
                    let heading = null

                    if (event.webkitCompassHeading !== undefined) {
                            heading = event.webkitCompassHeading;
                        }

                        else if (event.absolute && event.alpha !== null) {
                            heading = (360 - event.alpha) % 360;
                        }

                    const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                    const compassOrientation = directions[Math.round(heading / 45) % 8];

                    compassDisplay.textContent = `facing direction: ${compassOrientation}`;
                });

            }

            const initSocket = () => {
                socket = io.connect("/");

                socket.on('connect', () => {
                    // console.log(`Connected: ${socket.id}`);
                });

                socket.on("clients", (clients) => {
                    // console.log("Current clients:", clients);
                });

                socket.on('signal', async (myId, signal, peerId) => {
                    // console.log(`Received signal from ${peerId}`);
                    // console.log(signal);
                    if (!peer) {
                        peer = new SimplePeer({ initiator: false });

                        peer.on('signal', data => {
                            socket.emit('signal', peerId, data);
                        });

                        peer.on('connect', () => {
                            // console.log('Peer connection established!');
                        });

                        peer.on('error', err => {
                            // console.error('Peer error:', err);
                        });
                    }

                    peer.signal(signal);
                });            
            }

            init();
        }
    </script>
</body>
</html>
