<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Phone</title>
    </head>
    <body>
        <h1>You connected phone and computer</h1>
        <button id="btn">Request Permission</button>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"
            integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <script src="/socket.io/socket.io.js"></script>
        <script>
        {
            const computerId = new URLSearchParams(window.location.search).get('id');
            let socket;
            let peer;
            let permissionResults;
            let sensorInformation;

            // ── Shared sensor state (written by persistent listeners) ──────────────
            const sensorState = {
                vertical: 'N/A',
                horizontal: 'N/A',
                gyroMagnitude: 0,
                compassOrientation: null,
                batteryPercentage: 1,
            };
            

            const servers = {
                iceServers: [{
                    urls: 'stun:stun.l.google.com:19302'
                }]
            };

            const init = () => {
                initSocket();

                document.getElementById('btn').addEventListener('click', async () => {
                    const allAsked = await permissionRequests();
                    if (allAsked) {
                        dataCollection();
                    } 
                });
            }

            const permissionRequests = async () => {
                const permissionRequestResults = {
                    Orientation: "denied",
                    Gyro: "denied",
                    Microphone: "denied",
                    battery: "denied",
                };

                permissionRequestResults.Orientation = await requestOrientation();
                permissionRequestResults.Gyro = await requestGyro();
                permissionRequestResults.battery = await requestBattery();
                permissionRequestResults.Microphone = await requestMicrophone();

                permissionResults = permissionRequestResults;
                const allAsked = Object.values(permissionRequestResults);
                return allAsked
            };

            const requestOrientation = async () => {
                try {
                    if (typeof DeviceOrientationEvent !== "undefined" &&
                        typeof DeviceOrientationEvent?.requestPermission === "function") {
                        
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission !== "granted") return "denied";
                    } else if (typeof DeviceOrientationEvent === "undefined") {
                        return "impossible";
                    }

                    const hasData = await new Promise((resolve) => {
                        const timeout = setTimeout(() => resolve(false), 500);

                        window.addEventListener("deviceorientation", (e) => {
                            clearTimeout(timeout);
                            resolve(e.alpha !== null || e.beta !== null || e.gamma !== null);
                        }, { once: true });
                    });

                    // ── Register the persistent orientation + compass listener ─────────
                    if (hasData) {
                        window.addEventListener('deviceorientation', (event) => {
                            sensorState.vertical   = event.beta  !== null ? event.beta.toFixed(1)  : 'N/A';
                            sensorState.horizontal = event.gamma !== null ? event.gamma.toFixed(1) : 'N/A';

                            if (event.webkitCompassHeading !== undefined) {
                                const heading = event.webkitCompassHeading;
                                const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                                sensorState.compassOrientation = directions[Math.round(heading / 45) % 8];
                            } else if (event.absolute && event.alpha !== null) {
                                const heading = (360 - event.alpha) % 360;
                                const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                                sensorState.compassOrientation = directions[Math.round(heading / 45) % 8];
                            }
                        });
                    }

                    return hasData ? "granted" : "impossible";

                } catch (error) {
                    return "impossible";
                }
            };

            const requestGyro = async () => {
                try {
                    if (typeof DeviceMotionEvent !== "undefined" &&
                        typeof DeviceMotionEvent.requestPermission === "function") {
                        
                        const permission = await DeviceMotionEvent.requestPermission();
                        if (permission !== "granted") return "denied";
                    } else if (typeof DeviceMotionEvent === "undefined") {
                        return "impossible";
                    }

                    const hasData = await new Promise((resolve) => {
                        const timeout = setTimeout(() => resolve(false), 500);

                        window.addEventListener("devicemotion", (e) => {
                            clearTimeout(timeout);
                            resolve(e.rotationRate?.alpha !== null || e.rotationRate?.beta !== null || e.rotationRate?.gamma !== null);
                        }, { once: true });
                    });

                    // ── Register the persistent gyro listener ─────────────────────────
                    if (hasData) {
                        window.addEventListener('devicemotion', (event) => {
                            const { alpha, beta, gamma } = event.rotationRate ?? {};
                            if (alpha == null) return;
                            const raw = Math.sqrt(alpha ** 2 + beta ** 2 + gamma ** 2);
                            sensorState.gyroMagnitude = Math.min(Math.round((raw / 50) * 100), 100);
                        });
                    }

                    return hasData ? "granted" : "impossible";

                } catch (error) {
                    return "impossible";
                }
            };

            const requestMicrophone = async () => {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                
                    audioContext = new AudioContext();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    
                    const source = audioContext.createMediaStreamSource(micStream);
                    source.connect(analyser);

                    return "granted";

                } catch (error) {
                    return "denied";
                }
            };

            const requestBattery = async () => {
                if (!navigator.getBattery) {
                    return "impossible";
                } else {
                    // ── Register the persistent battery listener here ─────────────────
                    const battery = await navigator.getBattery();
                    sensorState.batteryPercentage = Math.round(battery.level * 100);
                    battery.addEventListener('levelchange', () => {
                        sensorState.batteryPercentage = Math.round(battery.level * 100);
                    });
                    return "granted";
                }
            };

            // ── dataCollection: now fully synchronous, just reads sensorState ──────
            const dataCollection = () => {
                setInterval(() => {
                    const sensorData = {
                        tiltY:              sensorState.horizontal,
                        tiltX:              sensorState.vertical,
                        gyroMagnitude:      sensorState.gyroMagnitude,
                        bassEnergy:         microphoneData(),
                        compassOrientation: sensorState.compassOrientation,
                        battery:            sensorState.batteryPercentage,
                    };

                    sensorInformation = {
                        permissions: permissionResults,
                        sensors: sensorData
                    };

                    if (peer && peer.connected) {
                        peer.send(JSON.stringify(sensorInformation));
                    }

                }, 100);
            };   

            const microphoneData = () => {
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                const bassRange = Math.floor(dataArray.length * 0.1);
                const bassSlice = dataArray.slice(0, bassRange);
                const bassAvg = bassSlice.reduce((sum, v) => sum + v, 0) / bassRange;

                const dynamicMax = Math.max(...dataArray) || 1;
                const bassEnergy = Math.round((bassAvg / dynamicMax) * 99) + 1;

                return Math.min(bassEnergy, 100);
            };

            const initSocket = () => {
                socket = io.connect("/");

                socket.on('connect', () => {
                    peer = new SimplePeer({
                        initiator: true,
                        config: servers
                    });

                    peer.on('signal', data => {
                        socket.emit('signal', computerId, data);
                    });

                    peer.on('connect', () => {
                        if (sensorInformation) {
                            peer.send(JSON.stringify(sensorInformation));
                        }
                    });

                });

                socket.on('signal', async (myId, signal, peerId) => {
                    if (peer && !peer.destroyed) {
                        peer.signal(signal);
                    };

                });            
            };

            init();
        }
    </script>
    </body>
</html>
