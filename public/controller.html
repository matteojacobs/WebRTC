<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone</title>
</head>
<body>
    <h1>You connected phone and computer</h1>
    <button id="btn">Request Permission</button>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    

    <script src="/socket.io/socket.io.js"></script>
    <script>
        {
            let socket;
            let peer;
            let peerConnection;
            let permissionResults

            const servers = {
                iceServers: [{
                    urls: 'stun:192.168.1.45:443'
                }]
            };

            const init = () => {
                initSocket();

                document.getElementById('btn').addEventListener('click', async () => {
                    const allAsked = await permissionRequests();
                    if (allAsked) {
                        dataCollection();
                    } 
                });
            }

            

            const permissionRequests = async () => {
                const permissionRequestResults = {
                    Orientation: "denied",
                    Gyro: "denied",
                    Microphone: "denied",
                    battery: "denied",
                };

                permissionRequestResults.Orientation = await requestOrientation();
                permissionRequestResults.Gyro = await requestGyro();
                permissionRequestResults.battery = await requestBattery();
                permissionRequestResults.Microphone = await requestMicrophone();

                permissionResults = permissionRequestResults;
                const allAsked = Object.values(permissionRequestResults);
                return allAsked
            };

            const requestOrientation = async () => {
                try {
                    // iOS 13+ requires explicit permission
                    if (typeof DeviceOrientationEvent !== "undefined" &&
                        typeof DeviceOrientationEvent?.requestPermission === "function") {
                        
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission !== "granted") return "denied";
                    } else if (typeof DeviceOrientationEvent === "undefined") {
                        return "impossible";
                    }

                    // Verify the device actually sends orientation data
                    const hasData = await new Promise((resolve) => {
                        const timeout = setTimeout(() => resolve(false), 500);

                        window.addEventListener("deviceorientation", (e) => {
                            clearTimeout(timeout);
                            // Check that at least one axis has real data
                            resolve(e.alpha !== null || e.beta !== null || e.gamma !== null);
                        }, { once: true });
                    });

                    return hasData ? "granted" : "impossible";

                } catch (error) {
                    return "impossible";
                }
            };

            const requestGyro = async () => {
                try {
                    // iOS 13+ requires explicit permission
                    if (typeof DeviceMotionEvent !== "undefined" &&
                        typeof DeviceMotionEvent.requestPermission === "function") {
                        
                        const permission = await DeviceMotionEvent.requestPermission();
                        if (permission !== "granted") return "denied";
                    } else if (typeof DeviceMotionEvent === "undefined") {
                        return "impossible";
                    }

                    // Verify the device actually sends motion data
                    const hasData = await new Promise((resolve) => {
                        const timeout = setTimeout(() => resolve(false), 500);

                        window.addEventListener("devicemotion", (e) => {
                            clearTimeout(timeout);
                            resolve(e.rotationRate?.alpha !== null || e.rotationRate?.beta  !== null || e.rotationRate?.gamma !== null);
                        }, { once: true });
                    });

                    return hasData ? "granted" : "impossible";

                } catch (error) {
                    return "impossible";
                }
            };

            const requestMicrophone = async () => {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                
                    audioContext = new AudioContext();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    
                    const source = audioContext.createMediaStreamSource(micStream);
                    source.connect(analyser);

                    return "granted";

                } catch (error) {
                    return "denied";
                }
            }

            const requestBattery = async () => {
                if (!navigator.getBattery) {
                    return "impossible";
                } 
                else {
                    return "granted";
                }
            }

            const dataCollection = async () => {
                setInterval(async () => {
                    const sensorData = {
                    tiltY: null,
                    tiltX: null,
                    gyroMagnitude: null,
                    bassEnergy: null,
                    compassOrientation: null,
                    battery: null

                }

                const { vertical, horizontal } = await orientationData();
                const { mappedGyroMagnitude } = await gyroData();
                const { compassOrientation } = await compassData();

                sensorData.tiltY = horizontal;
                sensorData.tiltX = vertical;
                sensorData.gyroMagnitude = mappedGyroMagnitude;
                sensorData.bassEnergy = microphoneData();
                sensorData.compassOrientation = compassOrientation;
                sensorData.battery = await batteryData();

                const sensorInformation = {
                    permissions: permissionResults,
                    sensors: sensorData
                };

                console.log(sensorInformation);
                }, 100);

                
            }

            

            const orientationData = () => {
                return new Promise((resolve) => {
                    window.addEventListener('deviceorientation', (event) => {
                    const vertical = event.beta !== null ? event.beta.toFixed(1) : 'N/A';    // front/back tilt (-180 to 180)
                    const horizontal = event.gamma !== null ? event.gamma.toFixed(1) : 'N/A'; // left/right tilt (-90 to 90)

                    resolve ({ vertical, horizontal });
                }, {once: true});
                
                });
            }

            const gyroData = () => {
                return new Promise((resolve) => {
                    window.addEventListener('devicemotion', (event) => {
                    const rotationRate = event.rotationRate;
                    const gyroMagnitude = Math.sqrt(rotationRate.alpha**2 + rotationRate.beta**2 + rotationRate.gamma**2)
                    const mappedGyroMagnitude = Math.min(Math.round((gyroMagnitude / 500) * 100), 100);
                    
                    resolve({ mappedGyroMagnitude });
                }, {once: true});
               
                });
            }

            const microphoneData = () => {
                analyser.fftSize = 256;

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                const bassRange = Math.floor(dataArray.length * 0.1);
                const bassSlice = dataArray.slice(0, bassRange);
                const bassEnergy = Math.round((bassSlice.reduce((sum, v) => sum + v, 0) / bassRange / 255) * 99) + 1;

                return bassEnergy
            }
            
            const compassData = () => {
                return new Promise((resolve) => {
                    window.addEventListener('deviceorientation', (event) => {
                    let heading = null

                    if (event.webkitCompassHeading !== undefined) {
                            heading = event.webkitCompassHeading;
                        }

                        else if (event.absolute && event.alpha !== null) {
                            heading = (360 - event.alpha) % 360;
                        }

                    const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                    const compassOrientation = directions[Math.round(heading / 45) % 8];

                    resolve ({ compassOrientation});
                }, {once: true});
                
                });

            }

            const batteryData = async () => {
                const battery = await navigator.getBattery();
                const batteryPercentage = Math.round(battery.level * 100);

                battery.addEventListener("levelchange", () =>{
                    batteryPercentage = Math.round(battery.level * 100);
                })

                return batteryPercentage

            }

            const initSocket = () => {
                socket = io.connect("/");

                socket.on('connect', () => {
                    // console.log(`Connected: ${socket.id}`);
                });

                socket.on("clients", (clients) => {
                    // console.log("Current clients:", clients);
                });

                socket.on('signal', async (myId, signal, peerId) => {
                    // console.log(`Received signal from ${peerId}`);
                    // console.log(signal);
                    if (!peer) {
                        peer = new SimplePeer({ initiator: false });

                        peer.on('signal', data => {
                            socket.emit('signal', peerId, data);
                        });

                        peer.on('connect', () => {
                            // console.log('Peer connection established!');
                        });

                        peer.on('error', err => {
                            // console.error('Peer error:', err);
                        });
                    }

                    peer.signal(signal);
                });            
            }

            init();
        }
    </script>
</body>
</html>
